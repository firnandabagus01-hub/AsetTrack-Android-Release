name: Publish Android update to website

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag release yang akan dipublikasikan, contoh v1.5"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-update:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Calculate APK metadata and notify website
        uses: actions/github-script@v7
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const fs = require("fs");
            const os = require("os");
            const path = require("path");
            const { execFileSync } = require("child_process");
            const crypto = require("crypto");

            const owner = "firnandabagus01-hub";
            const repo = "AsetTrack-Android-Release";
            let release = context.payload.release;

            if (!release) {
              const tag = process.env.RELEASE_TAG;
              if (!tag) throw new Error("Tag rilis wajib diisi saat dijalankan manual.");
              const result = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = result.data;
            }

            if (!release || release.draft || release.prerelease) {
              throw new Error("Rilis tidak valid, masih draft, atau prerelease.");
            }

            const tag = release.tag_name;
            const expectedAssetName = `PALAPA_TOSERBA_${tag.replace(/^v/i, "v")}.apk`;
            const apk = release.assets.find(asset => asset.name === expectedAssetName);

            if (!apk) {
              throw new Error(`APK ${expectedAssetName} tidak ditemukan pada release ${tag}.`);
            }

            const apkResponse = await fetch(apk.browser_download_url);
            if (!apkResponse.ok) {
              throw new Error(`Gagal mengunduh APK: HTTP ${apkResponse.status}`);
            }

            const apkBytes = Buffer.from(await apkResponse.arrayBuffer());
            const apkPath = path.join(os.tmpdir(), expectedAssetName);
            fs.writeFileSync(apkPath, apkBytes);

            const aapt = path.join(
              process.env.ANDROID_HOME,
              "build-tools",
              "35.0.0",
              "aapt"
            );
            const badging = execFileSync(aapt, ["dump", "badging", apkPath], { encoding: "utf8" });
            const versionMatch = badging.match(/^package:.*versionCode='(\\d+)'.*versionName='([^']+)'/m);

            if (!versionMatch) {
              throw new Error("Tidak dapat membaca versionCode/versionName dari APK.");
            }

            const versionCode = Number(versionMatch[1]);
            const versionName = versionMatch[2];
            const tagVersion = tag.replace(/^v/i, "");

            if (!Number.isInteger(versionCode) || versionCode < 1 || versionName !== tagVersion) {
              throw new Error(
                `Metadata APK tidak cocok dengan tag. Tag=${tagVersion}, APK=${versionName}, versionCode=${versionCode}`
              );
            }

            const sha256 = crypto.createHash("sha256").update(apkBytes).digest("hex").toUpperCase();
            const dispatchToken = process.env.WEBSITE_DISPATCH_TOKEN;

            if (!dispatchToken) {
              throw new Error("Secret WEBSITE_DISPATCH_TOKEN belum tersedia pada repository rilis Android.");
            }

            const dispatchResponse = await fetch(
              "https://api.github.com/repos/firnandabagus01-hub/AsetTrack-Web/dispatches",
              {
                method: "POST",
                headers: {
                  "Accept": "application/vnd.github+json",
                  "Authorization": `Bearer ${dispatchToken}`,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  event_type: "android_release_published",
                  client_payload: {
                    versionCode,
                    versionName,
                    apkUrl: apk.browser_download_url,
                    sha256,
                    releaseNotes: release.body || `AsetTrack Android ${tag}`
                  }
                })
              }
            );

            if (!dispatchResponse.ok) {
              const details = await dispatchResponse.text();
              throw new Error(`Gagal mengirim pembaruan ke website: HTTP ${dispatchResponse.status} - ${details}`);
            }

            core.info(`Website berhasil diberi tahu tentang AsetTrack ${tag}.`);
            core.info(`versionCode dari APK: ${versionCode}`);
            core.info(`APK SHA-256: ${sha256}`);
