name: Publish Android update to website

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag release yang akan dipublikasikan, contoh v1.3"
        required: true
        default: "v1.3"
        type: string
      version_code:
        description: "Android versionCode untuk release tersebut"
        required: true
        default: "4"
        type: string

permissions:
  contents: read

jobs:
  publish-update:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate APK checksum and notify website
        uses: actions/github-script@v7
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        with:
          script: |
            const owner = "firnandabagus01-hub";
            const repo = "AsetTrack-Android-Release";
            let release = context.payload.release;
            let versionCode;

            if (release) {
              const versionCodes = { "v1.3": 4 };
              versionCode = versionCodes[release.tag_name];
            } else {
              const tag = core.getInput("tag");
              versionCode = Number(core.getInput("version_code"));
              const result = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = result.data;
            }

            if (!release || !Number.isInteger(versionCode) || versionCode < 1) {
              core.setFailed("Release atau versionCode tidak valid.");
              return;
            }

            const tag = release.tag_name;
            const versionName = tag.replace(/^v/, "");
            const expectedAssetName = `PALAPA_TOSERBA_v${versionName}.apk`;
            const apk = release.assets.find(asset => asset.name === expectedAssetName);

            if (!apk) {
              core.setFailed(`APK ${expectedAssetName} tidak ditemukan pada release ${tag}.`);
              return;
            }

            const apkResponse = await fetch(apk.browser_download_url);
            if (!apkResponse.ok) {
              core.setFailed(`Gagal mengunduh APK: HTTP ${apkResponse.status}`);
              return;
            }

            const apkBytes = Buffer.from(await apkResponse.arrayBuffer());
            const sha256 = require("crypto").createHash("sha256").update(apkBytes).digest("hex");

            const dispatchResponse = await fetch(
              "https://api.github.com/repos/firnandabagus01-hub/AsetTrack-Web/dispatches",
              {
                method: "POST",
                headers: {
                  "Accept": "application/vnd.github+json",
                  "Authorization": `Bearer ${process.env.WEBSITE_DISPATCH_TOKEN}`,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  event_type: "android_release_published",
                  client_payload: {
                    versionCode,
                    versionName,
                    apkUrl: apk.browser_download_url,
                    sha256,
                    releaseNotes: release.body || `AsetTrack Android ${tag}`
                  }
                })
              }
            );

            if (!dispatchResponse.ok) {
              const details = await dispatchResponse.text();
              core.setFailed(`Gagal mengirim pembaruan ke website: HTTP ${dispatchResponse.status} - ${details}`);
              return;
            }

            core.info(`Website diberi tahu tentang AsetTrack ${tag} (versionCode ${versionCode}).`);
            core.info(`APK SHA-256: ${sha256}`);
